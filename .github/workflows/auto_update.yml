name: Auto-update Upstream Packages

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 04:00 UTC
  workflow_dispatch:      # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Debian package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2 gzip

      - name: Check and update upstream packages
        id: update_step
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x update.sh scripts/sync_all.py
          python3 scripts/sync_all.py

      - name: Commit and push changes
        if: steps.update_step.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debs/ Packages Packages.bz2 Packages.gz Release
          git commit -m "Auto-update upstream packages: ${{ steps.update_step.outputs.summary }}"
          git push origin main
